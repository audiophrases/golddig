[package]
name = "golddig"
version = "0.1.0"
description = "A fast, local-first dictionary desktop application"
edition = "2021"
license = "MPL-2.0"

[lib]
# The suffix keeps the library name distinct from the binary on Windows.
name = "golddig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.34", features = ["bundled", "modern_sqlite"] }
unicode-normalization = "0.1"
thiserror = "2"
anyhow = "1"

# Neural speech via the Edge Read Aloud service (see src/tts.rs). tokio, sha2, uuid and
# base64 are already in the tree through Tauri; only the WebSocket client is new.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
